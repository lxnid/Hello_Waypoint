services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waypoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waypoint_local}
      POSTGRES_DB: ${POSTGRES_DB:-waypoint}
    volumes:
      - waypoint_postgres:/var/lib/postgresql/data
    ports:
      # Only PostgreSQL is exposed for local tools; application containers still use database:5432.
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-waypoint} -d ${POSTGRES_DB:-waypoint}']
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      SERVE_CLIENT: 'true'
      DATABASE_URL: postgresql://${POSTGRES_USER:-waypoint}:${POSTGRES_PASSWORD:-waypoint_local}@database:5432/${POSTGRES_DB:-waypoint}
      JWT_SECRET: ${JWT_SECRET:-local-demo-only-change-this-secret-before-public-deployment-2026}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Peliyagoda2026!}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  waypoint_postgres:
